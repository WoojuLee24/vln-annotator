[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vln-annotator"
version = "1.0.0"
description = "Auto-annotate VLN datasets with LLM-generated navigation instructions from path geometry + rendered images"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0",
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = ["pytest", "black", "isort"]
# Anthropic has no OpenAI-compatible endpoint, so it needs its own SDK.
# Everything else (vLLM, OpenAI, Gemini) rides on `openai`.
api = ["anthropic>=0.40"]

[project.scripts]
vln-annotate = "vln_annotator.pipeline:main_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["vln_annotator*"]
