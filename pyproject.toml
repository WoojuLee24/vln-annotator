[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "vln-annotator"
version = "1.0.0"
description = "Auto-annotate VLN datasets with LLM-generated navigation instructions from path geometry + rendered images"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0",
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = ["pytest", "black", "isort"]

[project.scripts]
vln-annotate = "vln_annotator.pipeline:main_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["vln_annotator*"]
